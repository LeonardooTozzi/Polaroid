<section class="section cameras" id="cameras">
  <div class="wrap">
    <div class="cameras-head" data-reveal>
      <p class="mono kicker">Câmeras</p>
      <h2 class="display cameras-title">Ícones que você reconhece de longe</h2>
    </div>

    <div class="cameras-grid">
      <article class="cam" data-reveal>
        <div class="cam-visual">
          <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=700&q=80" alt="Câmera OneStep" loading="lazy">
        </div>
        <div class="cam-info">
          <div class="cam-top">
            <h3>OneStep</h3>
            <span class="cam-tag mono">1977</span>
          </div>
          <p>O clássico com o arco-íris. Simples, direto e inconfundível.</p>
        </div>
      </article>

      <article class="cam" data-reveal style="--d:120ms">
        <div class="cam-visual">
          <img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=700&q=80" alt="Câmera SX-70" loading="lazy">
        </div>
        <div class="cam-info">
          <div class="cam-top">
            <h3>SX-70</h3>
            <span class="cam-tag mono">1972</span>
          </div>
          <p>Dobrável, elegante e revolucionária. O design que virou arte.</p>
        </div>
      </article>

      <article class="cam" data-reveal style="--d:240ms">
        <div class="cam-visual">
          <img src="https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=700&q=80" alt="Câmera Now" loading="lazy">
        </div>
        <div class="cam-info">
          <div class="cam-top">
            <h3>Now</h3>
            <span class="cam-tag mono">Hoje</span>
          </div>
          <p>O presente da Polaroid: analógica, moderna e pronta para o seu próximo instante.</p>
        </div>
      </article>
    </div>
  </div>
</section>
